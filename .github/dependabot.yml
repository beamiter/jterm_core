version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep Rust 1.95-only parking_lot out of grouped updates. Retain the
    # validated uuid line separately from the SQLite security/MSRV change.
    ignore:
      - dependency-name: parking_lot
        versions: [">=0.13"]
      - dependency-name: uuid
        versions: [">=1.27"]
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /crates/jterm_engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
