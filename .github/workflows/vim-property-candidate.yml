name: Native diagnostic rendering candidate
on:
  push:
    branches: [codex/vim-native-next-20261024]
    paths: [.github/workflows/vim-property-candidate.yml, scripts/stage-vim-property-index.py, runtime/vim9/test_render_property_index.py]
permissions:
  contents: write
concurrency:
  group: native-vim-property-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply exact runtime-only optimization
        run: |
          mkdir -p evidence
          git show 0cdb8d4e578066c16af42fa58bde08a2002c6796:runtime/vim9/bridge.vim > "$RUNNER_TEMP/bridge-before.vim"
          python3 scripts/stage-vim-property-index.py
          git diff --check
          python3 -m py_compile runtime/vim9/benchmark_scroll.py runtime/vim9/test_render_property_index.py
      - name: Install real Vim
        run: sudo apt-get update -qq && sudo apt-get install -y -qq vim-nox
      - name: Verify native renderer and exact full-frame differential
        shell: bash
        run: |
          set -euo pipefail
          VIM9_PROPERTY_BASELINE="$RUNNER_TEMP/bridge-before.vim" python3 -m unittest discover -s runtime/vim9 -p 'test_render_*.py' -v 2>&1 | tee evidence/render-tests.txt
          python3 runtime/vim9/test_benchmark_metrics.py -v 2>&1 | tee evidence/benchmark-integrity.txt
      - name: Measure both runtimes on the same controlled diagnostic workload
        shell: bash
        run: |
          set -euo pipefail
          for density in 0 24; do
            python3 runtime/vim9/benchmark_scroll.py --samples 40 --windows 1 2 --lines 100000 --properties-per-line "$density" --runtime "$RUNNER_TEMP/bridge-before.vim" > "evidence/before-$density.json"
            python3 runtime/vim9/benchmark_scroll.py --samples 40 --windows 1 2 --lines 100000 --properties-per-line "$density" > "evidence/after-$density.json"
          done
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Validate embedded runtime and Rust Vim bridge consumers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib vim9 2>&1 | tee evidence/rust-vim-tests.txt
      - name: Prepare clean candidate without moving master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          base='0cdb8d4e578066c16af42fa58bde08a2002c6796'
          files=['runtime/vim9/bridge.vim','runtime/vim9/benchmark_scroll.py','runtime/vim9/test_render_property_index.py','.github/workflows/vim9-benchmark.yml']
          temporary=['scripts/stage-vim-property-index.py','.github/workflows/vim-property-candidate.yml','.github/workflows/vim-native-next.yml','.github/workflows/vim-modal-probe.yml']
          changed=set(subprocess.check_output(['git','diff',base,'--name-only'],text=True).splitlines())
          assert changed==set(files+temporary), changed
          assert not subprocess.check_output(['git','diff',base,'--','src','Cargo.toml','Cargo.lock'])
          subprocess.run(['git','diff','--check'],check=True)
          api='https://api.github.com/repos/beamiter/jterm_core'
          def request(path,data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert request('/git/ref/heads/master')['object']['sha']==base, 'master advanced; rebase required'
          entries=[]
          for path in files:
              sha=request('/git/blobs',{'encoding':'base64','content':base64.b64encode(Path(path).read_bytes()).decode()})['sha']
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=request('/git/trees',{'base_tree':request('/git/commits/'+base)['tree']['sha'],'tree':entries})['sha']
          message='perf(vim): index diagnostic properties once per source frame\n\nBucket source spans by line and cache property definitions only within the current window frame. Retain property ordering, local/global type identity, paint budgets, cache invalidation, Unicode mappings and protocol behavior.\n\nAdd six live property mutation/split/budget tests and a full-frame differential replay, plus an optional bounded dense diagnostic workload in the source-bound scroll benchmark. Default benchmark and full renderer gates remain intact. Validate real-Vim renderer and benchmark integrity tests, same-host before/after semantic acknowledgements, and Rust Vim bridge consumers. No Rust source or dependency changes; benchmark numbers do not measure displayed GPU latency.'
          commit=request('/git/commits',{'message':message,'tree':tree,'parents':[base]})['sha']
          Path('evidence/candidate.json').write_text(json.dumps({'base':base,'commit':commit,'files':entries,'master_updated':False},indent=2)+'\n')
          Path('evidence/candidate.patch').write_bytes(subprocess.check_output(['git','diff',base,'--',*files]))
          print('VALIDATED_CANDIDATE='+commit)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vim-property-candidate-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
