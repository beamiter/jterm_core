name: Real Vim pixel input
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vim9-pixel-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VIM9_SIMPLECC_ROOT: ${{ github.workspace }}/.providers/simplecc
      VIM9_SIMPLEGIT_ROOT: ${{ github.workspace }}/.providers/simplegit
      VIM9_TEST_SIMPLE_ROOT: ${{ github.workspace }}/.providers
      VIM9_TEST_VIMRC: ${{ github.workspace }}/.providers/vimrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out audited SimpleCC popup provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/simplecc
          ref: bd711d6e273fc2db4e8ef96618629309b621d306
          path: .providers/simplecc
          persist-credentials: false
      - name: Check out audited SimpleGit popup provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/simplegit
          ref: af06c595809241c0e403c4f988bd90818af4602b
          path: .providers/simplegit
          persist-credentials: false
      - name: Check out audited Vim workbench configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/vimrc
          ref: 27abbc9143d5b7abbddd78c4610e367fac4c252e
          path: .providers/vimrc
          persist-credentials: false
      - name: Check out audited SimpleWhichKey provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/simplewhichkey
          ref: 365c9c34a68dded6c65ca0163f2443e880306b8a
          path: .providers/simplewhichkey
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq vim-nox ripgrep
      - run: |
          python3 runtime/vim9/test_pixel_input.py
          python3 runtime/vim9/test_quick_navigation.py
          python3 runtime/vim9/test_overscan.py
          python3 runtime/vim9/test_render_delta.py
          python3 runtime/vim9/test_render_windows.py
          python3 runtime/vim9/test_render_matches.py
          python3 runtime/vim9/test_render_cursor.py
          python3 runtime/vim9/test_render_columns.py
          python3 runtime/vim9/test_render_wincolor.py
          python3 runtime/vim9/test_render_scratch.py
          python3 runtime/vim9/test_render_special.py
          python3 runtime/vim9/test_render_listchars.py
          python3 runtime/vim9/test_render_completion.py
          python3 runtime/vim9/test_render_popups.py
          python3 runtime/vim9/test_render_virtual_text.py
          python3 runtime/vim9/test_simple_popups.py
          python3 runtime/vim9/test_simple_code_lens.py
          python3 runtime/vim9/test_simple_inlay_hints.py
          python3 runtime/vim9/test_simple_navigation.py
          python3 runtime/vim9/test_semantic_editing.py
          python3 runtime/vim9/test_render_popup_cards.py
          python3 runtime/vim9/test_lsp_popup_cards.py
