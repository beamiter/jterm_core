name: CI

on:
  push:
    branches: [master, dev/shared-terminal-engine-20261108]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, Clippy, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Check independent engine and family tooling
        run: |
          cargo fmt --manifest-path crates/jterm_engine/Cargo.toml -- --check
          cargo clippy --manifest-path crates/jterm_engine/Cargo.toml --locked --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path crates/jterm_engine/Cargo.toml --locked --no-deps
          python3 crates/jterm_engine/scripts/check_boundary.py --engine-only
          python3 scripts/test-family-engine.py
      - name: Terminal performance probe transport tests (not host measurements)
        run: python3 -m unittest discover -s scripts/terminal-performance -p 'test_terminal_baseline.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: test-${{ matrix.rust }}
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y curl minisign vim-nox ripgrep
      - name: Test independent engine with its own lockfile
        run: cargo test --manifest-path crates/jterm_engine/Cargo.toml --locked --all-targets
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - name: Real Vim9 editor and project workflow
        run: |
          python3 runtime/vim9/test_bridge.py
          python3 runtime/vim9/test_workbench.py
          python3 runtime/vim9/test_shell.py
          python3 runtime/vim9/test_scroll.py
          python3 runtime/vim9/test_overscan.py
          python3 runtime/vim9/test_render_serialization.py
          python3 runtime/vim9/test_render_delta.py
          python3 runtime/vim9/test_render_popups.py
          cargo test --locked --lib vim9::tests::real_vim9_round_trip -- --ignored

  engine-msrv:
    name: Independent engine (Rust 1.86)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: "1.86.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: independent-engine-1.86
          workspaces: crates/jterm_engine
      - run: cargo test --manifest-path crates/jterm_engine/Cargo.toml --locked --all-targets
      - run: python3 crates/jterm_engine/scripts/check_boundary.py --engine-only
