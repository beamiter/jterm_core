name: Native modal focus probe
on:
  push:
    branches: [codex/vim-native-next-20261024]
    paths: [.github/workflows/vim-modal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Reproduce production modal query ownership
        shell: bash
        run: |
          mkdir -p probe/src evidence
          printf '[package]\nname="modal-probe"\nversion="0.1.0"\nedition="2021"\n[dependencies]\negui="=0.36.1"\n' > probe/Cargo.toml
          cat > probe/src/main.rs <<'RS'
          fn main() {
              for repair in [false, true] {
                  let ctx = egui::Context::default();
                  let mut query = String::new();
                  let mut needs_focus = true;
                  let mut query_id = None;
                  for frame in 0..8 {
                      let input = egui::RawInput {
                          screen_rect: Some(egui::Rect::from_min_size(egui::Pos2::ZERO, egui::vec2(1000.0, 800.0))),
                          events: if frame == 3 { vec![egui::Event::Text(">vertical split".into())] } else { vec![] },
                          ..Default::default()
                      };
                      ctx.run_ui(input, |ui| {
                          ui.label("Vim buffer");
                          egui::Modal::new(egui::Id::new(("vim9_dialog", "session"))).show(&ctx, |ui| {
                              ui.set_width(720.0);
                              ui.heading("Quick Open");
                              ui.weak("project");
                              let id = ui.make_persistent_id(("vim9_dialog_query", "session"));
                              query_id = Some(id);
                              if needs_focus {
                                  ui.memory_mut(|m| m.request_focus(id));
                                  if !repair { needs_focus = false; }
                              }
                              let edit = ui.add(egui::TextEdit::singleline(&mut query).id(id));
                              if repair && needs_focus && ui.is_visible() && ui.is_enabled() {
                                  edit.request_focus();
                                  needs_focus = false;
                              }
                              println!("repair={repair} frame={frame} visible={} enabled={} focus={} pending={needs_focus} query={query:?}", ui.is_visible(), ui.is_enabled(), edit.has_focus());
                              let _ = ui.button("Cancel");
                          });
                      }).drop_without_applying_deltas();
                      println!("end focus={:?} id={query_id:?}", ctx.memory(|m| m.focused()));
                  }
                  println!("FINAL repair={repair} query={query:?}");
              }
          }
          RS
          cargo run --manifest-path probe/Cargo.toml | tee evidence/probe.txt
          find "$HOME/.cargo/registry/src" -path '*/egui-0.36.1/src/containers/modal.rs' -exec cp {} evidence/modal.rs \;
          find "$HOME/.cargo/registry/src" -path '*/egui-0.36.1/src/memory/mod.rs' -exec cp {} evidence/memory.rs \;
          find "$HOME/.cargo/registry/src" -path '*/egui-0.36.1/src/widgets/text_edit/builder.rs' -exec cp {} evidence/text-edit.rs \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-modal-probe
          path: evidence/
          retention-days: 3
