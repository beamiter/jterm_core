name: Validate direct pixel input candidate
on:
  push:
    branches: [work/vim9-pixel-input-20261021]
permissions:
  contents: write
concurrency:
  group: vim9-pixel-input-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: d0e27eac29eaec790c00a63d7b0065f21d14fd1f
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq vim-nox ripgrep minisign curl > /tmp/deps.log 2>&1 || { tail -80 /tmp/deps.log; exit 1; }
      - run: |
          python3 .maintenance/apply-pixel-core.py
          python3 .maintenance/refine-pixel-core.py
      - run: cargo fmt --all && git diff --check
      - run: cargo test --quiet --locked --all-targets
      - run: cargo clippy --quiet --locked --all-targets -- -D warnings
      - run: cargo doc --quiet --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Actual Vim source-input and legacy regressions
        run: |
          python3 runtime/vim9/test_pixel_input.py
          python3 runtime/vim9/test_overscan.py
          python3 runtime/vim9/test_bridge.py
          python3 runtime/vim9/test_render_delta.py
          python3 runtime/vim9/test_render_windows.py
          python3 runtime/vim9/test_scroll.py
          python3 runtime/vim9/test_shell.py
          cargo test --quiet --locked --lib vim9::tests::real_vim9_round_trip -- --ignored
      - name: Prepare tested source commit without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo, base = os.environ['GITHUB_REPOSITORY'], os.environ['BASE']
          def req(path, data=None):
              r = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json'})
              with urllib.request.urlopen(r, timeout=60) as response: return json.load(response)
          if req('/git/ref/heads/master')['object']['sha'] != base: raise SystemExit('master advanced')
          paths = ['src/vim9.rs', 'src/vim9_render.rs', 'src/vim9_pixel_scroll.rs', 'src/vim9_viewport.rs',
              'runtime/vim9/bridge.vim', 'runtime/vim9/test_pixel_input.py']
          entries = []
          for p in paths:
              blob = req('/git/blobs', {'content':Path(p).read_text(), 'encoding':'utf-8'})
              entries.append({'path':p,'mode':'100644','type':'blob','sha':blob['sha']})
          tree = req('/git/trees', {'base_tree':req('/git/commits/' + base)['tree']['sha'],'tree':entries})
          commit = req('/git/commits', {'message':'feat(vim9): coordinate direct pixels with source-bound scroll and pointer transactions',
              'tree':tree['sha'], 'parents':[base]})
          print('::notice title=Pixel input candidate::' + json.dumps({'base':base,'candidate':commit['sha'],'tree':tree['sha'],'files':entries}))
          PY
