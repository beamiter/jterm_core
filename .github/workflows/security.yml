name: Supply-chain security

on:
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - tools/companion-host-harness/Cargo.toml
      - tools/companion-host-harness/Cargo.lock
      - crates/jterm_engine/Cargo.toml
      - crates/jterm_engine/Cargo.lock
      - scripts/security-audit.sh
      - scripts/test-security-audit.py
      - .cargo/audit.toml
      - .github/workflows/security.yml
  push:
    branches: [master, dev/shared-terminal-engine-20261108]
    paths:
      - Cargo.toml
      - Cargo.lock
      - tools/companion-host-harness/Cargo.toml
      - tools/companion-host-harness/Cargo.lock
      - crates/jterm_engine/Cargo.toml
      - crates/jterm_engine/Cargo.lock
      - scripts/security-audit.sh
      - scripts/test-security-audit.py
      - .cargo/audit.toml
      - .github/workflows/security.yml
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test audit failure handling offline
        run: python3 scripts/test-security-audit.py

      # dtolnay/rust-toolchain stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      # actions/cache v6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-audit-target
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$HOME/.cache/cargo-audit-target" \
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" \
            --locked --force
          cargo audit --version | grep -Eq \
            "[[:space:]]${CARGO_AUDIT_VERSION}$"

      - name: Audit all locked dependency graphs
        run: bash scripts/security-audit.sh
