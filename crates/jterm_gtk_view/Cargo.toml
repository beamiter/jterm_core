[package]
name = "jterm_gtk_view"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "GTK4 presentation and input for shared terminal sessions"
license = "MIT"
publish = false

[dependencies]
jterm_protocol = { version = "0.1.0", path = "../jterm_protocol" }
pcre2 = "0.2"
gtk4 = { version = "0.11.4", features = ["v4_12"] }
jterm_engine = { version = "0.1.0", path = "../jterm_engine" }
jterm_runtime = { version = "0.1.0", path = "../jterm_runtime", features = ["terminal"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
gdk4-wayland = { version = "0.11.4", features = ["wayland_crate"] }
jterm_runtime = { version = "0.1.0", path = "../jterm_runtime", features = ["linux-pty"] }

[workspace]
