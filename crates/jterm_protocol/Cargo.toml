[package]
name = "jterm_protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Transport-independent terminal wire contracts"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
jterm_engine = { version = "0.1.0", path = "../jterm_engine", optional = true }

[features]
engine-projection = ["dep:jterm_engine"]

[dev-dependencies]
serde_json = "1"

[workspace]
