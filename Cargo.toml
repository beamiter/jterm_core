[package]
name = "jterm_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Shared UI-independent core for the jterm family of terminal emulators"
readme = "README.md"
repository = "https://github.com/beamiter/jterm_core"
license = "MIT"
keywords = ["terminal", "pty", "parser", "jterm"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Opt-in shared fixture data for adapter dev-dependencies; no runtime reducer.
session-parity-tests = []

[dependencies]
# Pin the policy engine so a branch move cannot silently change the contract.
jagent = { version = "0.7.0", git = "https://github.com/beamiter/jagent.git", rev = "f269c3c6afafcf9b6d60b3cccd741649fdb74576" }
crossbeam-channel = "0.5"
# The agent_task worktree/session machinery: shared locks and the ids that
# name isolated Codex homes and systemd scopes.
# Rust 1.86 MSRV: parking_lot 0.13 / lock_api 0.5 require Rust 1.95.
parking_lot = "0.12"
# uuid 1.27+ requires Rust 1.89; keep the last MSRV-compatible minor.
uuid = { version = "~1.26.0", features = ["v4", "serde"] }
libc = "0.2.189"
log = "0.4"
lru = "0.19"
memchr = "2.8.3"
once_cell = "1.21"
dirs = "7.0"
# Typo ranking for the shared command-correction engine (all four apps
# already depend on the same version).
fuzzy-matcher = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# The workflow library is authored in TOML or YAML; both formats deserialize
# through the same serde derive so they cannot disagree about a field's type.
serde_norway = "=0.9.42"
toml = "1.1"
unicode-width = "0.2"
zstd = "0.14"
