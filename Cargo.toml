[package]
name = "jterm_core"
version = "0.1.0"
edition = "2021"
description = "Shared UI-independent core for the jterm family of terminal emulators"
license = "MIT"

[dependencies]
libc = "0.2.189"
log = "0.4"
lru = "0.18"
memchr = "2.8.3"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2"
