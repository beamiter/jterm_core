[package]
name = "jterm_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Shared UI-independent core for the jterm family of terminal emulators"
readme = "README.md"
repository = "https://github.com/beamiter/jterm_core"
license = "MIT"
keywords = ["terminal", "pty", "parser", "jterm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Pin the policy engine so a branch move cannot silently change the contract.
jagent = { git = "https://github.com/beamiter/jagent.git", rev = "fcb9768bb832547988056baa38b2d4239341b361" }
crossbeam-channel = "0.5"
libc = "0.2.189"
log = "0.4"
lru = "0.18"
memchr = "2.8.3"
once_cell = "1.21"
dirs = "6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
toml = "1.1"
unicode-width = "0.2"
