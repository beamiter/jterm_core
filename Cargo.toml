[package]
name = "jterm_core"
version = "0.1.0"
edition = "2021"
description = "Shared UI-independent core for the jterm family of terminal emulators"
license = "MIT"

[dependencies]
jagent = { git = "https://github.com/beamiter/jagent.git", branch = "master" }
crossbeam-channel = "0.5"
libc = "0.2.189"
log = "0.4"
lru = "0.18"
memchr = "2.8.3"
once_cell = "1.21"
dirs = "6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
unicode-width = "0.2"
