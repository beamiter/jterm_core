[package]
name = "jterm_core"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Shared UI-independent core for the jterm family of terminal emulators"
readme = "README.md"
repository = "https://github.com/beamiter/jterm_core"
license = "MIT"
keywords = ["terminal", "pty", "parser", "jterm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Pin the policy engine so a branch move cannot silently change the contract.
jagent = { git = "https://github.com/beamiter/jagent.git", rev = "6ed0b9f037eff9359d62ed448e0d117327fabe26" }
crossbeam-channel = "0.5"
# The agent_task worktree/session machinery: shared locks and the ids that
# name isolated Codex homes and systemd scopes.
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2.189"
log = "0.4"
lru = "0.18"
memchr = "2.8.3"
once_cell = "1.21"
dirs = "7.0"
# Typo ranking for the shared command-correction engine (all four apps
# already depend on the same version).
fuzzy-matcher = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# The workflow library is authored in TOML or YAML; both formats deserialize
# through the same serde derive so they cannot disagree about a field's type.
serde_yaml_ng = "0.10"
toml = "1.1"
unicode-width = "0.2"
